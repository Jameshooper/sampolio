allowBuilds:
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security floors for transitive dependencies (pnpm audit). Keep each within
# its existing major so dependants keep working; drop an entry once the
# parent package ships the fixed version itself.
overrides:
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  source-map-js@>=1.0.0 <1.2.2: ^1.2.4
  vite@>=8.2.0 <8.2.4: ^8.2.4
