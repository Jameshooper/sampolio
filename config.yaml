name: Sampolio
version: "3.20.1"
slug: sampolio
description: Self-hosted personal finance planner — cash flow, wealth, shared mortgage, split expenses, budgets, goals, trips, and optional read-only bank sync.
url: https://github.com/jameshooper/sampolio
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# A published port, NOT Ingress. Ingress would put Home Assistant's own login
# and 2FA in front of the app, which is strictly better, but the app does not
# render under it: Next.js needs a build-time `basePath` to match the
# ingress-token path prefix client-side, and that token is not known until the
# add-on runs. Verified in a browser against a mock Supervisor — see
# docs/known-gaps.md #4 and docs/operations.md §12. Revisit if Next.js gains
# runtime base-path support.
#
# Consequence to be deliberate about: on this port the ONLY authentication is
# Sampolio's own NextAuth login. Keep the port off the public internet — the
# separately-scoped Tailscale Funnel path for the bank callback (run.sh) is
# the one intentional exception, and it publishes that single route.
ports:
  3999/tcp: 3999
ports_description:
  3999/tcp: Sampolio web UI (protect at the network layer — no Home Assistant auth in front)
webui: "http://[HOST]:[PORT:3999]"
panel_icon: mdi:cash-multiple
map:
  - type: data
    read_only: false
# No `privileged:` and no `devices:` on purpose. The optional embedded
# Tailscale (run.sh) runs tailscaled with --tun=userspace-networking, which
# needs neither a TUN device nor NET_ADMIN/NET_RAW. Granting those would let
# an app-level compromise reach raw sockets and interface control on Home
# Assistant's internal bridge — lateral movement toward Supervisor and other
# add-ons — for a capability this add-on never actually needs.
options:
  auth_secret: ""
  encryption_key: ""
  auth_url: ""
  enable_banking_app_id: ""
  enable_banking_redirect_url: ""
  enable_banking_private_key: ""
  ha_webhook_url: ""
  tailscale_auth_key: ""
  tailscale_funnel: false
schema:
  auth_secret: password
  encryption_key: password
  auth_url: url
  enable_banking_app_id: str?
  # str?, not url? — these default to "" and HA's url validator rejects an
  # empty string even on an optional field, since "" isn't a valid URL. The
  # app (src/lib/bank/*, src/lib/split-notify.ts) already treats a
  # missing/blank value as "feature disabled" on its own.
  enable_banking_redirect_url: str?
  enable_banking_private_key: password?
  ha_webhook_url: str?
  tailscale_auth_key: password?
  tailscale_funnel: bool
