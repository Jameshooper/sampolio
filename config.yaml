name: Sampolio
version: "3.24.1"
slug: sampolio
description: A self-hosted personal finance planner — cash flow projections, budgets, goals and trips, shared mortgage and split expenses, with optional read-only bank sync.
url: https://github.com/jameshooper/sampolio
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# No published port by default. Ingress would be better still — it puts Home
# Assistant's own login and 2FA in front — but the app cannot render under it
# (docs/known-gaps.md #4), so the next best thing is not to expose an
# unauthenticated port unless it is asked for. `null` means Supervisor
# publishes nothing until a host port is set in the add-on's Network section.
#
# The intended way in is tailscale_serve: the whole app on :8443 of this
# add-on's own tailnet hostname, reachable from your tailnet only and over
# real HTTPS. That matters beyond exposure — a session cookie keeps its
# Secure attribute there, whereas over plain http:// on a LAN address the
# browser discards it and sign-in silently never sticks.
#
# If you do publish the port: nothing but Sampolio's own login stands in
# front of it, so keep it off the public internet.
ports:
  3999/tcp: null
ports_description:
  3999/tcp: Optional direct access (no Home Assistant auth in front — prefer tailscale_serve)
webui: "http://[HOST]:[PORT:3999]"
panel_icon: mdi:cash-multiple
map:
  - type: data
    read_only: false
  # Read-only, and only for the Enable Banking signing key: a bank credential
  # does not belong in an add-on option, where its value sits in plain text in
  # options.json and is shown in the Configuration tab. /ssl is the
  # conventional home for keys on a Home Assistant host and is shared with
  # other add-ons, so nothing here may write to it.
  - type: ssl
    read_only: true
# No `privileged:` and no `devices:` on purpose. The optional embedded
# Tailscale (run.sh) runs tailscaled with --tun=userspace-networking, which
# needs neither a TUN device nor NET_ADMIN/NET_RAW. Granting those would let
# an app-level compromise reach raw sockets and interface control on Home
# Assistant's internal bridge — lateral movement toward Supervisor and other
# add-ons — for a capability this add-on never actually needs.
options:
  auth_secret: ""
  auth_secret_file: ""
  encryption_key: ""
  encryption_key_file: ""
  auth_url: ""
  enable_banking_app_id: ""
  enable_banking_redirect_url: ""
  enable_banking_private_key_file: "/ssl/sampolio-enable-banking.pem"
  ha_webhook_url: ""
  ha_summary_minutes: 0
  tailscale_auth_key: ""
  tailscale_serve: true
  tailscale_funnel: false
  reset_admin_password: false
  wipe_data: false
schema:
  # Either give the value here, or — better — put it in a file under /ssl and
  # name the file instead. An option's value is stored verbatim in
  # options.json, shown on the Configuration tab and carried in the add-on's
  # config backup; the `password` type below only masks the input box and
  # changes none of that. The file is still plain text on the host, so this
  # reduces surfaces rather than encrypting anything — encrypt your Home
  # Assistant backups too.
  auth_secret: password?
  auth_secret_file: str?
  encryption_key: password?
  encryption_key_file: str?
  auth_url: url
  enable_banking_app_id: str?
  # str?, not url? — these default to "" and HA's url validator rejects an
  # empty string even on an optional field, since "" isn't a valid URL. The
  # app (src/lib/bank/*, src/lib/split-notify.ts) already treats a
  # missing/blank value as "feature disabled" on its own.
  enable_banking_redirect_url: str?
  enable_banking_private_key_file: str?
  ha_webhook_url: str?
  # 0 = off. Pushes balances, card totals and the month's headroom — numbers
  # only, never transactions or merchant names — to ha_webhook_url.
  ha_summary_minutes: int(0,1440)?
  tailscale_auth_key: password?
  tailscale_serve: bool
  tailscale_funnel: bool
  # Recovery switches. Both act once and then refuse to repeat until switched
  # off again, so leaving one on cannot wipe the data on every restart.
  # reset_admin_password generates a new password and prints it to the add-on
  # log once — it is not an input field, so no password is ever stored in
  # options.json or shown in the Configuration tab.
  reset_admin_password: bool
  wipe_data: bool
